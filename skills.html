<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills | Kashish Dagar</title>
    <meta name="description" content="Technical skills of Kashish Dagar.">
    <link rel="stylesheet" href="index.css">
    <style>
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .skill-category {
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            color: var(--primary);
            font-family: var(--font-heading);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.5rem;
        }

        .skill-item {
            margin-bottom: 1.5rem;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .skill-name {
            font-weight: 500;
        }

        .skill-level {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border-radius: 4px;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
        }
        
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .skill-tag {
            background: rgba(59, 130, 246, 0.1);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: var(--transition);
        }

        .skill-tag:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Kashish<span>.</span></a>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">&#9776;</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="skills.html" class="nav-link">Skills</a></li>
                <li><a href="projects.html" class="nav-link">Projects</a></li>
                <li><a href="resume.html" class="nav-link">Resume</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <section>
            <h2 class="section-title">Technical Skills</h2>
            
            <div class="skills-grid">
                <div class="card">
                    <h3 class="skill-category">Languages</h3>
                    <div class="tags-container">
                        <span class="skill-tag">C</span>
                        <span class="skill-tag">Python</span>
                        <span class="skill-tag">JavaScript</span>
                    </div>
                </div>

                <div class="card">
                    <h3 class="skill-category">Web Development</h3>
                    <div class="tags-container">
                        <span class="skill-tag">HTML</span>
                        <span class="skill-tag">CSS</span>
                    </div>
                </div>

                <div class="card">
                    <h3 class="skill-category">Tools</h3>
                    <div class="tags-container">
                        <span class="skill-tag">Git</span>
                        <span class="skill-tag">GitHub</span>
                        <span class="skill-tag">VS Code</span>
                    </div>
                </div>

                <div class="card">
                    <h3 class="skill-category">Core Areas</h3>
                    <div class="tags-container">
                        <span class="skill-tag">Data Structures</span>
                        <span class="skill-tag">Problem Solving</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
