<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashish Dagar | Portfolio</title>
    <meta name="description" content="Portfolio of Kashish Dagar, Aspiring Computer Science Engineer.">
    <link rel="stylesheet" href="index.css">
    <style>
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: calc(100vh - var(--nav-height));
            gap: 4rem;
        }
        
        .hero-content {
            flex: 1;
            max-width: 600px;
        }

        .hero-title {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-family: var(--font-heading);
            font-weight: 600;
        }

        .hero-text {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
        }

        .hero-image-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .hero-image {
            width: 350px;
            height: 350px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--card-border);
            position: relative;
            z-index: 10;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.2);
        }

        .hero-image-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.6;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.05); opacity: 0.8; }
        }

        @media (max-width: 992px) {
            .hero {
                flex-direction: column-reverse;
                text-align: center;
                justify-content: center;
                padding-top: 2rem;
            }
            .hero-buttons {
                justify-content: center;
            }
            .hero-title {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Kashish<span>.</span></a>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu">&#9776;</button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
                <li><a href="skills.html" class="nav-link">Skills</a></li>
                <li><a href="projects.html" class="nav-link">Projects</a></li>
                <li><a href="resume.html" class="nav-link">Resume</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <section class="hero">
            <div class="hero-content">
                <h1 class="hero-title">Kashish Dagar</h1>
                <h2 class="hero-subtitle">Aspiring Computer Science Engineer</h2>
                <p class="hero-text">
                    AI/ML & Web Development Enthusiast passionate about building impactful solutions and constantly learning new technologies.
                </p>
                <div class="hero-buttons">
                    <a href="projects.html" class="btn btn-primary">View Projects</a>
                    <a href="resume.html" class="btn btn-outline">Download Resume</a>
                </div>
            </div>
            <div class="hero-image-container">
                <div class="hero-image-glow"></div>
                <img src="photo.jpeg" alt="Kashish Dagar" class="hero-image" onerror="this.src='https://via.placeholder.com/350?text=Profile+Photo'">
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
